<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz – Apprendre l’anglais</title>
  <script src="data.js"></script>
  <style>
    :root {
      --bg: #0f1325;
      --card: #1f2640;
      --accent: #4f9deb;
      --accent2: #6ee7b7;
      --danger: #f87171;
      --success: #34d399;
      --warning: #fbbf24;
      --text: #eef1ff;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, #1c2030, var(--bg) 70%);
      color: var(--text);
      padding: clamp(12px, 3vw, 24px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(12px, 2.5vw, 20px);
    }
    h1 { margin: 0; font-size: clamp(1.4rem, 4vw, 2.4rem); text-align: center; }
    .screen { width: min(98vw, 1100px); display: flex; flex-direction: column; gap: clamp(10px, 2.5vw, 18px); align-items: center; }
    .screen[hidden] { display: none; }
    button.reset {
      appearance: none;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #04121f;
      font-weight: 700;
      padding: 10px 18px;
      box-shadow: 0 6px 18px rgba(79,157,235,0.35);
      cursor: pointer;
      font-size: clamp(0.95rem, 2vw, 1rem);
    }
    button.secondary {
      background: rgba(255,255,255,0.12);
      color: var(--text);
      box-shadow: none;
      border: 1px solid rgba(255,255,255,0.25);
      font-weight: 600;
    }
    button.ghost {
      background: transparent;
      color: var(--text);
      box-shadow: none;
      border: 1px solid rgba(255,255,255,0.25);
      font-weight: 600;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .panel {
      background: rgba(31,38,64,0.7);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: clamp(12px, 3vw, 18px);
      width: 100%;
      box-shadow: 0 10px 24px rgba(0,0,0,0.25);
    }
    .categories {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 8px 14px;
    }
    .cat { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 10px; background: rgba(255,255,255,0.06); }
    .cat input { width: 18px; height: 18px; }
    .cat label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
    .hud { display: flex; flex-wrap: wrap; gap: 10px 16px; justify-content: center; font-size: clamp(0.9rem, 2vw, 1rem); }
    .choices { display: grid; grid-template-columns: repeat(5, 1fr); gap: clamp(6px, 2vmin, 10px); width: min(98vw, 1100px); }
    @media (max-width: 720px) {
      .choices { grid-template-columns: repeat(2, 1fr); }
    }
    .choice {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; padding: clamp(6px, 2vmin, 10px);
      min-height: clamp(76px, 16vmin, 150px);
      border-radius: 12px; background: rgba(255,255,255,0.92); color: #04121f;
      box-shadow: 0 6px 16px rgba(0,0,0,0.25);
      border: 2px solid transparent;
      cursor: pointer; user-select: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.2s ease, background 0.2s ease;
    }
    .choice:hover:not(.disabled):not(.correct):not(.wrong) { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(0,0,0,0.32); }
    .choice .emoji { font-size: clamp(2rem, 7vmin, 4rem); line-height: 1; }
    .choice .name { font-size: clamp(0.7rem, 2vmin, 0.95rem); text-align: center; padding: 0 4px; }
    .choice.correct { background: #d4f7dc; border-color: #22c55e; }
    .choice.wrong { background: #ffe2e2; border-color: #ef4444; }
    .choice.disabled { cursor: not-allowed; opacity: 0.95; }
    .end .stat { font-size: clamp(1rem, 3vw, 1.4rem); }
    .end .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  </style>
</head>
<body>
  <h1>Quiz – Apprendre l’anglais</h1>

  <!-- Écran sélection -->
  <section id="screenSelect" class="screen">
    <div class="panel" aria-live="polite">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
        <h2 style="margin:0; font-size:clamp(1.1rem,2.5vw,1.5rem);">Choisis les catégories</h2>
        <div class="row">
          <button class="reset secondary" id="btnAll">Tout sélectionner</button>
          <button class="reset secondary" id="btnNone">Tout désélectionner</button>
        </div>
      </div>
      <div class="categories" id="categories" style="margin-top:12px;"></div>
        <div class="row" style="margin-top:12px; gap:12px;">
        <label>Niveau
          <select id="levelSelect" style="margin-left:8px; padding:6px 10px; border-radius:8px;">
            <option value="1">1 (Facile)</option>
            <option value="2">2 (Moyen)</option>
            <option value="3" selected>3 (Difficile/Tout)</option>
          </select>
        </label>
        <label>Nombre de questions
          <select id="qCount" style="margin-left:8px; padding:6px 10px; border-radius:8px;">
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="15">15</option>
            <option value="20" selected>20</option>
            <option value="30">30</option>
            <option value="40">40</option>
            <option value="50">50</option>
            <option value="all">Tout le pool</option>
          </select>
        </label>
        <label style="display:flex;align-items:center;gap:8px;">
          <input type="checkbox" id="showText" checked>
          Afficher le texte des cartes
        </label>
      </div>
      <div class="row" style="margin-top:12px;">
        <button class="reset" id="btnStart">Démarrer le quiz</button>
        <a class="reset ghost" href="index.html" style="text-decoration:none;">Retour à l’accueil</a>
      </div>
      <div id="selectError" style="text-align:center; margin-top:8px; color:var(--warning);" aria-live="polite"></div>
    </div>
  </section>

  <!-- Écran jeu -->
  <section id="screenPlay" class="screen" hidden>
    <div class="hud" aria-live="polite">
      <span>Question <b id="qNum">1</b> / <b id="qTotal">1</b></span>
      <span>Bonnes : <b id="sOk">0</b></span>
      <span>Erreurs : <b id="sErr">0</b></span>
      <span>Restantes : <b id="qLeft">0</b></span>
    </div>
    <div class="row" aria-live="polite">
      <span id="questionText" style="font-size:clamp(1rem,3vw,1.6rem);">Écoute le mot…</span>
    </div>
    <div class="row">
      <button class="reset secondary" id="btnRepeat" aria-label="Répéter le mot anglais">🔊 Répéter</button>
      <button class="reset ghost" id="btnBackSelect">Retour au menu</button>
      <a class="reset ghost" href="index.html" style="text-decoration:none;">Accueil</a>
    </div>
    <div class="choices" id="choices" aria-live="polite"></div>
  </section>

  <!-- Écran fin -->
  <section id="screenEnd" class="screen end" hidden>
    <div class="panel" style="text-align:center; display:flex; flex-direction:column; gap:10px;">
      <h2 style="margin:0; font-size:clamp(1.2rem,3vw,1.8rem);">Quiz terminé</h2>
      <div class="stat">Score : <b id="fOk">0</b> / <b id="fTotal">0</b> (<b id="fPct">0</b> %)</div>
      <div class="stat">Erreurs : <b id="fErr">0</b></div>
      <div class="actions">
        <button class="reset" id="btnReplay">Rejouer avec les mêmes catégories</button>
        <button class="reset secondary" id="btnChange">Changer de catégories</button>
        <a class="reset ghost" href="index.html" style="text-decoration:none;">Retour à l’accueil</a>
      </div>
    </div>
  </section>

  <canvas id="confetti" width="0" height="0" style="position:fixed; inset:0; pointer-events:none; z-index:10;"></canvas>

  <script>
    const EMOJI_THEMES = {animals:'🐱', food:'🍎', actions:'🏃', objects:'📦', colors:'🎨', numbers:'🔢', body:'🧍', clothes:'👕', nature:'🌳', school:'🏫', transport:'🚗', jobs:'👷', emotions:'😊', shapes:'🔶', verbs:'✍️'};
    const categoriesDiv = document.getElementById('categories');
    const btnAll = document.getElementById('btnAll');
    const btnNone = document.getElementById('btnNone');
    const qCount = document.getElementById('qCount');
    const btnStart = document.getElementById('btnStart');
    const selectError = document.getElementById('selectError');
    const screenSelect = document.getElementById('screenSelect');
    const screenPlay = document.getElementById('screenPlay');
    const screenEnd = document.getElementById('screenEnd');
    const qNum = document.getElementById('qNum');
    const qTotal = document.getElementById('qTotal');
    const sOk = document.getElementById('sOk');
    const sErr = document.getElementById('sErr');
    const qLeft = document.getElementById('qLeft');
    const questionText = document.getElementById('questionText');
    const btnRepeat = document.getElementById('btnRepeat');
    const btnBackSelect = document.getElementById('btnBackSelect');
    const levelSelect = document.getElementById('levelSelect');
    const showTextChk = document.getElementById('showText');
    const choicesDiv = document.getElementById('choices');
    const fOk = document.getElementById('fOk');
    const fTotal = document.getElementById('fTotal');
    const fErr = document.getElementById('fErr');
    const fPct = document.getElementById('fPct');
    const btnReplay = document.getElementById('btnReplay');
    const btnChange = document.getElementById('btnChange');
    const confettiCanvas = document.getElementById('confetti');
    let ctxConf = confettiCanvas.getContext ? confettiCanvas.getContext('2d') : null;

    let selectedKeys = [];
    let pool = [];
    let currentIndex = 0;
    let score = {ok:0, err:0};
    let locked = false;
    let audioCtx = null;

    function initCategories() {
      categoriesDiv.innerHTML = Object.entries(window.THEMES).map(([k,t]) => `
        <div class="cat">
          <input type="checkbox" id="cat_${k}" value="${k}">
          <label for="cat_${k}">${EMOJI_THEMES[k]||''} ${t.label}</label>
        </div>
      `).join('');
    }
    function getSelected() {
      return Array.from(categoriesDiv.querySelectorAll('input[type=checkbox]:checked')).map(cb => cb.value);
    }
    btnAll.onclick = () => categoriesDiv.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = true);
    btnNone.onclick = () => categoriesDiv.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = false);
    btnStart.onclick = startQuiz;

    function shuffle(a){ const arr=a.slice(); for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]];} return arr; }
    function startQuiz(){
      selectedKeys = getSelected();
      if(selectedKeys.length===0){ selectError.textContent='Sélectionne au moins une catégorie.'; return; }
      selectError.textContent='';
      buildPool();
      currentIndex=0; score={ok:0,err:0}; locked=false;
      screenSelect.hidden=true; screenEnd.hidden=true; screenPlay.hidden=false;
      showQuestion();
    }
    function levelMapForTheme(key){
      const map={}; const items=(window.THEMES[key]&&window.THEMES[key].items)||[];
      items.forEach(it=>{ map[it.name]=(typeof it.level==="number")?it.level:3; }); return map;
    }
    function inLevel(item,key,lv){ if(lv===3)return true; if(item && typeof item.level==="number") return item.level===lv; return 3===lv; }
    function buildPool(){
      const map=new Map();
      const lv=parseInt(levelSelect.value||'3',10);
      for(const k of selectedKeys){
        const items=(window.THEMES[k] && window.THEMES[k].items || []);
        for(const it of items){
          if(inLevel(it,k,lv) && !map.has(it.name)) map.set(it.name, {...it});
        }
      }
      let list=shuffle(Array.from(map.values()));
      if(list.length===0){
        for(const k of selectedKeys){
          const items=(window.THEMES[k] && window.THEMES[k].items || []);
          for(const it of items){ if(!map.has(it.name)) map.set(it.name, {...it}); }
        }
        list=shuffle(Array.from(map.values()));
      }
      const val=qCount.value;
      const limit = val==='all' ? list.length : parseInt(val,10);
      pool = list.slice(0, Math.max(1, limit));
    }
    function speak(text){
      if(!('speechSynthesis' in window)) return;
      try{ window.speechSynthesis.cancel(); }catch(e){}
      const u=new SpeechSynthesisUtterance(text);
      u.lang='en-US'; u.rate=0.85; u.pitch=1.05; u.volume=1;
      window.speechSynthesis.speak(u);
    }
    function showQuestion(){
      if(currentIndex>=pool.length){ endQuiz(); return; }
      const correct=pool[currentIndex];
      qNum.textContent=currentIndex+1; qTotal.textContent=pool.length;
      qLeft.textContent=pool.length - (currentIndex+1);
      sOk.textContent=score.ok; sErr.textContent=score.err;
      questionText.textContent = `Écoute : ${(correct.label||correct.name)}`;
      choicesDiv.innerHTML='';
      const distractors=[];
      // collect from selected categories
      const seen=new Set([correct.name]);
      for(const k of selectedKeys){
        const items=window.THEMES[k] && window.THEMES[k].items || [];
        for(const it of items){
          if(!seen.has(it.name)){
            seen.add(it.name); distractors.push({...it});
            if(distractors.length>=9) break;
          }
        }
        if(distractors.length>=9) break;
      }
      // if not enough, try to fill from all themes? but spec says selected categories; keep as is
      let choices=[correct, ...shuffle(distractors).slice(0,9)];
      choices=shuffle(choices);
      for(const c of choices){
        const btn=document.createElement('button');
        btn.className='choice';
        btn.type='button';
        btn.innerHTML=`<div class="emoji">${c.emoji}</div><div class="name">${c.label||c.name}</div>`;
        btn.setAttribute('aria-label', `Choisir ${(c.label||c.name)}`);
        btn.onclick=()=>answer(c, correct, btn);
        choicesDiv.appendChild(btn);
      }
      locked=false; btnRepeat.disabled=false;
      speak(correct.label||correct.name);
    }
    function answer(chosen, correct, btn){
      if(locked) return; locked=true; btnRepeat.disabled=true;
      const buttons=Array.from(choicesDiv.querySelectorAll('.choice'));
      for(const b of buttons) b.classList.add('disabled');
      if(chosen.name===correct.name){
        btn.classList.add('correct'); score.ok++;
        sOk.textContent=score.ok;
        setTimeout(()=>{ currentIndex++; showQuestion(); }, 800);
      }else{
        btn.classList.add('wrong');
        for(const b of buttons){
          const name=b.querySelector('.name')?.textContent || '';
          // find which original choice this is? easier: store data
        }
        // find correct button
        for(const b of buttons){
          // compare by emoji+text? simpler: reconstruct by index not easy; use data attribute
        }
        // better: attach data
        for(let i=0;i<buttons.length;i++){
          const b=buttons[i];
          // we need to know name; store in closure? easier to re-query
        }
        // simpler approach: store names
        setTimeout(()=>{ currentIndex++; showQuestion(); }, 1300);
        score.err++; sErr.textContent=score.err;
      }
    }
    // fix answer to find correct button properly
    function answerFixed(chosen, correct){
      if(locked) return; locked=true; btnRepeat.disabled=true;
      const buttons=Array.from(choicesDiv.querySelectorAll('.choice'));
      for(const b of buttons) b.classList.add('disabled');
      let chosenBtn=null, correctBtn=null;
      buttons.forEach(b=>{
        const name=b.dataset.name; if(name===chosen.name) chosenBtn=b; if(name===correct.name) correctBtn=b;
      });
      if(chosen.name===correct.name){
        if(chosenBtn) chosenBtn.classList.add('correct'); score.ok++; sOk.textContent=score.ok;
        setTimeout(()=>{ currentIndex++; showQuestion(); }, 800);
      }else{
        if(chosenBtn) chosenBtn.classList.add('wrong');
        if(correctBtn) correctBtn.classList.add('correct');
        score.err++; sErr.textContent=score.err;
        setTimeout(()=>{ currentIndex++; showQuestion(); }, 1400);
      }
    }
    // patch showQuestion to add data-name
    const _showQuestion=showQuestion;
    showQuestion=function(){
      if(currentIndex>=pool.length){ endQuiz(); return; }
      const correct=pool[currentIndex];
      qNum.textContent=currentIndex+1; qTotal.textContent=pool.length;
      qLeft.textContent=pool.length - (currentIndex+1);
      sOk.textContent=score.ok; sErr.textContent=score.err;
      questionText.textContent = '';
      choicesDiv.innerHTML='';
      const distractors=[]; const seen=new Set([correct.name]);
      for(const k of selectedKeys){
        const items=window.THEMES[k] && window.THEMES[k].items || [];
        for(const it of items){
          if(!seen.has(it.name)){ seen.add(it.name); distractors.push({...it}); if(distractors.length>=9) break; }
        }
        if(distractors.length>=9) break;
      }
      let choices=[correct, ...shuffle(distractors).slice(0,9)];
      choices=shuffle(choices);
      const showText = showTextChk.checked;
      for(const c of choices){
        const btn=document.createElement('button');
        btn.className='choice'; btn.type='button'; btn.dataset.name=c.name;
        btn.innerHTML=`<div class="emoji">${c.emoji}</div>` + (showText ? `<div class="name">${c.label||c.name}</div>` : '');
        btn.setAttribute('aria-label', `Choisir ${(c.label||c.name)}`);
        btn.onclick=()=>answerFixed(c, correct);
        choicesDiv.appendChild(btn);
      }
      locked=false; btnRepeat.disabled=false;
      speak(correct.label||correct.name);
    };
    btnRepeat.onclick=()=>{ if(!locked){ const correct=pool[currentIndex]; if(correct) speak(correct.label||correct.name); } };
    function endQuiz(){
      fOk.textContent=score.ok; fTotal.textContent=pool.length; fErr.textContent=score.err;
      const pct = pool.length===0?0:Math.round(score.ok/pool.length*100);
      fPct.textContent=pct; screenPlay.hidden=true; screenEnd.hidden=false; playWinSound();
    }
    function playWinSound(){
      try{
        audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
        const ctx=audioCtx; if(ctx.state==='suspended') ctx.resume();
        const notes=[523,659,784,1046,784,1046]; let t=ctx.currentTime;
        for(const f of notes){ const o=ctx.createOscillator(); const g=ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value=f; o.type='triangle'; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.18,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+0.18); o.start(t); o.stop(t+0.2); t+=0.12; }
      }catch(e){}
    }
    btnReplay.onclick=()=>{ buildPool(); currentIndex=0; score={ok:0,err:0}; screenEnd.hidden=true; screenPlay.hidden=false; showQuestion(); };
    btnChange.onclick=()=>{ screenEnd.hidden=true; screenSelect.hidden=false; };
    btnBackSelect.onclick=()=>{ screenPlay.hidden=true; screenSelect.hidden=false; };
    initCategories();
  </script>
</body>
</html>
