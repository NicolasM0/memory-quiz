<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Memory Game</title>
<style>
  :root {
    --bg: #12141c;
    --card-back: #2a2f45;
    --card-back-2: #3b4266;
    --accent: #6c8cff;
    --match: #2ecc71;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: radial-gradient(circle at 50% 0%, #1c2030, var(--bg) 70%);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: #eef1ff;
    padding: 24px;
  }
  h1 { margin: 0; font-size: 1.8rem; letter-spacing: 0.5px; }
  .controls {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }
  label.field {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: #aab2d5;
  }
  label.field select {
    max-width: 260px;
    padding: 8px 10px;
    border-radius: 10px;
    border: 1px solid #3b4266;
    background: #1c2030;
    color: #eef1ff;
    font-size: 0.85rem;
  }
  .hud {
    display: flex;
    gap: 28px;
    font-size: 0.95rem;
    color: #aab2d5;
  }
  .hud b { color: #eef1ff; }
  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    width: max-content;
    perspective: 1000px;
    justify-content: center;
  }
  .card {
    aspect-ratio: 1;
    position: relative;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.35s ease;
    border: none;
    background: none;
    padding: 0;
  }
  .card.flipped, .card.matched { transform: rotateY(180deg); }
  .card .face {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    border-radius: calc(var(--card, 80px) * 0.13);
    backface-visibility: hidden;
    font-weight: 600;
    overflow: hidden;
    text-align: center;
  }
  .card .back {
    background: linear-gradient(145deg, var(--card-back-2), var(--card-back));
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.05);
    font-size: calc(var(--card, 80px) * 0.42);
    color: #7d86b8;
  }
  .card .front {
    background: #f7f8ff;
    color: #1a1d2b;
    transform: rotateY(180deg);
  }
  .card .emoji { font-size: calc(var(--card, 80px) * 0.44); line-height: 1; }
  .card .name { font-size: clamp(0.5rem, calc(var(--card, 80px) * 0.15), 1.3rem); padding: 0 3px; }
  .card.matched .front { background: #d6ffe4; box-shadow: inset 0 0 0 2px var(--match); }
  .card.matched { pointer-events: none; }
  button.reset {
    border: none;
    border-radius: 10px;
    padding: 10px 22px;
    font-size: 0.95rem;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    cursor: pointer;
  }
  button.reset:hover { filter: brightness(1.1); }
  .win { color: var(--match); font-weight: 700; min-height: 1.2em; }
  .translation { min-height: 1.2em; font-size: 0.95rem; color: #9fe6c0; }
  button.reset.secondary { background: #1f9d6b; }
  button.reset.secondary:hover { filter: brightness(1.12); }
  .turn { min-height: 1.2em; font-size: 1rem; font-weight: 700; color: #ffd166; }
  .turn:empty, .win:empty, .translation:empty { display: none; }
  input[type="range"] {
    width: 120px;
    accent-color: var(--accent);
  }
  .rate-val { min-width: 2.4em; display: inline-block; color: #eef1ff; }
  #confetti {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 999;
    display: none;
  }
  body.cursor-p1,
  body.cursor-p1 .card {
    cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 24 24'><path d='M3 2 L3 19 L8 14.5 L11 21 L14 19.7 L11 13.3 L18 13.3 Z' fill='%234c8dff' stroke='white' stroke-width='1.2' stroke-linejoin='round'/></svg>") 3 2, pointer;
  }
  body.cursor-p2,
  body.cursor-p2 .card {
    cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 24 24'><path d='M3 2 L3 19 L8 14.5 L11 21 L14 19.7 L11 13.3 L18 13.3 Z' fill='%23ff5a5f' stroke='white' stroke-width='1.2' stroke-linejoin='round'/></svg>") 3 2, pointer;
  }
  body.cursor-p3,
  body.cursor-p3 .card {
    cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 24 24'><path d='M3 2 L3 19 L8 14.5 L11 21 L14 19.7 L11 13.3 L18 13.3 Z' fill='%232ecc71' stroke='white' stroke-width='1.2' stroke-linejoin='round'/></svg>") 3 2, pointer;
  }
  body.cursor-p4,
  body.cursor-p4 .card {
    cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 24 24'><path d='M3 2 L3 19 L8 14.5 L11 21 L14 19.7 L11 13.3 L18 13.3 Z' fill='%23ff9f1c' stroke='white' stroke-width='1.2' stroke-linejoin='round'/></svg>") 3 2, pointer;
  }
  @media (max-width: 560px) {
    body {
      padding: 10px;
      gap: 8px;
      justify-content: flex-start;
    }
    h1 { font-size: 1.3rem; }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 10px;
      width: 100%;
      max-width: 440px;
    }
    label.field {
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
    }
    label.field select { max-width: none; width: 100%; }
    .hud { gap: 14px; font-size: 0.85rem; flex-wrap: wrap; justify-content: center; }
    input[type="range"] { width: 100%; }
  }
</style>
</head>
<body>
  <h1>Memory Game</h1>
  <canvas id="confetti"></canvas>
  <div class="controls">
    <label class="field">Theme
      <select id="themeSelect"></select>
    </label>
    <label class="field">Cards
      <select id="countSelect"></select>
    </label>
    <label class="field">Level
      <select id="levelSelect">
        <option value="1">Niveau 1 (facile)</option>
        <option value="2">Niveau 2 (moyen)</option>
        <option value="3">Niveau 3 (avancé)</option>
      </select>
    </label>
    <label class="field">Players
      <select id="playersSelect">
        <option value="1">1 player</option>
        <option value="2">2 players</option>
        <option value="3">3 players</option>
        <option value="4">4 players</option>
      </select>
    </label>
  </div>
  <div class="hud">
    <span>Moves: <b id="moves">0</b></span>
    <span>Pairs: <b id="pairs">0</b> / <b id="total">8</b></span>
    <span id="p1Hud" hidden>Player 1: <b id="p1">0</b></span>
    <span id="p2Hud" hidden>Player 2: <b id="p2">0</b></span>
    <span id="p3Hud" hidden>Player 3: <b id="p3">0</b></span>
    <span id="p4Hud" hidden>Player 4: <b id="p4">0</b></span>
  </div>
  <div class="turn" id="turn"></div>
  <div class="win" id="win"></div>
  <div class="translation" id="translationText"></div>
  <div class="board" id="board"></div>
  <div class="controls">
    <label class="field">Voice
      <select id="voiceSelect"></select>
    </label>
    <label class="field">Speed
      <input type="range" id="rate" min="0.5" max="1.3" step="0.05" value="0.85" />
      <span class="rate-val" id="rateVal">0.85x</span>
    </label>
    <button class="reset secondary" id="translateBtn">🔈 Traduction FR</button>
    <button class="reset" id="reset">New Game</button>
  </div>

  function scoreVoice(v) {
    const name = (v.name || "").toLowerCase();
    let score = 0;
    const idx = PREFERRED.indexOf(v.name);
    if (idx !== -1) score += 1000 - idx;
    if (/natural|neural|online/.test(name)) score += 500;
    if (/premium|enhanced/.test(name)) score += 300;
    if (/rhvoice/.test(name)) score += 200;
    if (/female|samantha|karen|aria|jenny|sonia|zira/.test(name)) score += 50;
    const en = (v.lang || "").toLowerCase();
    if (en.startsWith("en-gb")) score += 20;
    else if (en.startsWith("en-us")) score += 15;
    else if (en.startsWith("en")) score += 10;
    return score;
  }

  function bestVoice() {
    const english = voices.filter((v) => /^en/i.test(v.lang || ""));
    const pool = english.length ? english : voices;
    return pool.slice().sort((a, b) => scoreVoice(b) - scoreVoice(a))[0] || null;
  }

  function playWinSound() {
    try {

      const notes = [523.25, 659.25, 783.99, 1046.5];
      const now = audioCtx.currentTime;
      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.value = freq;
        const t = now + i * 0.14;
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.25, t + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.55);
      });
    } catch (e) {

  }

  // ---------- Confetti ----------
  function launchConfetti() {
    if (!confettiCanvas) return;
    const ctx = confettiCanvas.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    confettiCanvas.style.display = "block";
    confettiCanvas.width = window.innerWidth * dpr;
    confettiCanvas.height = window.innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const colors = ["#6c8cff", "#2ecc71", "#ffd166", "#ef476f", "#06d6a0", "#f78c6b"];
    const particles = [];
    for (let i = 0; i < 160; i++) {
      particles.push({
        x: Math.random() * window.innerWidth,
        y: -20 - Math.random() * window.innerHeight * 0.3,
        vx: (Math.random() - 0.5) * 3,
        vy: 2 + Math.random() * 4,
        size: 6 + Math.random() * 7,
        color: colors[(Math.random() * colors.length) | 0],
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.3,
      });
    }

    const start = performance.now();
    function frame(now) {
      const elapsed = now - start;
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      particles.forEach((p) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.06;
        p.rot += p.vr;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        ctx.restore();
      });
      if (elapsed < 4000) {
        requestAnimationFrame(frame);
      } else {
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        confettiCanvas.style.display = "none";
      }
    }
    requestAnimationFrame(frame);
  }

  function levelMapForTheme(key) {
    const order = LEVEL_ORDER[key] || THEMES[key].items.map((it) => it.name);
    const n = order.length;
    const l1 = Math.round(n * 0.25);
    const l2 = Math.round(n * 0.5);
    const map = {};
    order.forEach((name, i) => {
      map[name] = i < l1 ? 1 : i < l2 ? 2 : 3;
    });
    return map;
  }

  function poolForSelectedLevel(key) {
    const levelOf = levelMapForTheme(key);
    const byLevel = { 1: [], 2: [], 3: [] };
    THEMES[key].items.forEach((it) => {
      const lv = levelOf[it.name] || 3;
      byLevel[lv].push(it);
    });
    const pool = [];
    for (let lv = 1; lv <= Math.min(selectedLevel, 3); lv++) pool.push(...byLevel[lv]);
    for (let lv = selectedLevel + 1; lv <= 3 && pool.length < pairCount; lv++) pool.push(...byLevel[lv]);
    return pool;

  // Computed once per grid creation (NOT on window resize) so cards are as large
  // as possible on big screens while still fitting a phone.
  function computeBoardLayout(n) {
    const vw = window.innerWidth || document.documentElement.clientWidth || 1024;
    const vh = window.innerHeight || document.documentElement.clientHeight || 768;
    const cs = getComputedStyle(document.body);
    const padX = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
    const gap = vw < 560 ? 6 : 10;
    const availW = Math.max(200, vw - padX);

    let overhead = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
    const rowGap = parseFloat(cs.rowGap) || 0;
    let flexItems = 0;
    for (const el of document.body.children) {
      const style = getComputedStyle(el);
      if (el === board) { flexItems++; continue; }
      if (el.tagName === "CANVAS" || el.tagName === "SCRIPT" || el.tagName === "STYLE" ||
          style.position === "fixed" || style.display === "none") continue;
      overhead += el.getBoundingClientRect().height;
      flexItems++;
    }
    overhead += rowGap * Math.max(0, flexItems - 1);
    let availH = vh - overhead;
    if (!(availH > 120) || availH > vh) availH = Math.max(160, vh * 0.6);

    const minCard = 40;
    const maxCard = vw < 560 ? 110 : 150;

    function scan(colSets) {
      let best = null;
      const wantWide = availW >= availH;
      for (const cols of colSets) {
        const rows = Math.ceil(n / cols);
        const wFit = (availW - (cols - 1) * gap) / cols;
        const hFit = (availH - (rows - 1) * gap) / rows;
        const size = Math.max(minCard, Math.min(maxCard, Math.min(wFit, hFit)));
        const width = cols * size + (cols - 1) * gap;
        const height = rows * size + (rows - 1) * gap;
        if (width > availW + 1 || height > availH + 1) continue;
        const orientationOk = wantWide ? width >= height : width <= height;
        const shape = Math.abs(Math.log(width / height)) + (orientationOk ? 0 : 0.3);
        if (!best || size > best.size + 0.01 ||
            (Math.abs(size - best.size) <= 0.01 && shape < best.shape)) {
          best = { cols, size, width, shape };
        }
      }
      return best;
    }

    // Prefer grids where every row and column is full (columns divide the total).
    const divisors = [];
    const allCols = [];
    for (let c = 1; c <= n; c++) {
      allCols.push(c);
      if (n % c === 0) divisors.push(c);
    }
    let best = scan(divisors) || scan(allCols);
    if (!best) {
      const cols = Math.max(1, Math.ceil(Math.sqrt(n)));
      const size = minCard;
      best = { cols, size, width: cols * size + (cols - 1) * gap };
    }
    return { cols: best.cols, size: best.size, gap, width: best.width };
  }

  function buildDeck() {
    const pairs = Math.min(pairCount, maxPairs());
    pairCount = pairs;
    totalEl.textContent = pairs;
    pairsEl.textContent = "0";

    const pool = poolForSelectedLevel(currentThemeKey());
    const items = shuffle(pool.length >= pairs ? pool : THEMES[currentThemeKey()].items).slice(0, pairs);
    const deck = shuffle([...items, ...items]);

    const cards = pairs * 2;
    const layout = computeBoardLayout(cards);
    board.innerHTML = "";
    board.style.gap = layout.gap + "px";
    board.style.gridTemplateColumns = `repeat(${layout.cols}, ${layout.size}px)`;
    board.style.width = layout.width + "px";
    board.style.setProperty("--card", layout.size + "px");

    deck.forEach((item) => {
      const card = document.createElement("button");
      card.className = "card";
      card.dataset.name = item.name;
      card.innerHTML = `
        <div class="face back">?</div>
        <div class="face front">
          <div class="emoji">${item.emoji}</div>
          <div class="name">${item.name}</div>
        </div>`;
      card.addEventListener("click", () => flip(card));
      board.appendChild(card);
    });
  }

  function renderScores() {
    const scoreEls = [p1El, p2El, p3El, p4El];
    const hudEls = [p1Hud, p2Hud, p3Hud, p4Hud];
    scoreEls.forEach((el, i) => {
      el.textContent = scores[i];
      el.style.color = PLAYER_COLORS[i + 1];
    });
    hudEls.forEach((el, i) => {
      el.style.color = PLAYER_COLORS[i + 1];
    });
    p1Hud.hidden = players < 2;
    p2Hud.hidden = players < 2;
    p3Hud.hidden = players < 3;
    p4Hud.hidden = players < 4;
  }

  function renderTurn() {
    const multi = players >= 2;
    turnEl.textContent = multi ? `Player ${currentPlayer}'s turn` : "";
    turnEl.style.color = multi ? PLAYER_COLORS[currentPlayer] : "";
    document.body.classList.toggle("cursor-p1", multi && currentPlayer === 1);
    document.body.classList.toggle("cursor-p2", multi && currentPlayer === 2);
    document.body.classList.toggle("cursor-p3", multi && currentPlayer === 3);
    document.body.classList.toggle("cursor-p4", multi && currentPlayer === 4);
  }

  function endGame() {
    if (players >= 2) {
      const active = scores.slice(0, players);
      const max = Math.max(...active);
      const winners = active.map((s, i) => (s === max ? i + 1 : 0)).filter((n) => n > 0);
      const line = active.join(" - ");
      if (winners.length > 1) {
        winEl.textContent = `Tie! ${line}`;
        speak("It's a tie!");
      } else {
        winEl.textContent = `Player ${winners[0]} wins! ${line}`;
        speak(`Player ${winners[0]} wins!`);
      }
    } else {
      winEl.textContent = `You won in ${moves} moves!`;
      speak("You won!");
    }
    playWinSound();
    launchConfetti();
  }

  function flip(card) {
    if (lock || card.classList.contains("flipped") || card.classList.contains("matched")) return;

    card.classList.add("flipped");
    lastFlippedName = card.dataset.name;
    speak(card.dataset.name);

    if (!first) {
      first = card;
      return;
    }

    moves++;
    movesEl.textContent = moves;
    lock = true;

    if (first.dataset.name === card.dataset.name) {
      first.classList.add("matched");
      card.classList.add("matched");
      matched++;
      pairsEl.textContent = matched;

      first = null;
      lock = false;

      if (players >= 2) {
        scores[currentPlayer - 1]++;
        renderScores();
      }

      if (matched === pairCount) {
        endGame();
      } else {
        renderTurn();
      }
    } else {
      const a = first;
      first = null;
      setTimeout(() => {
        a.classList.remove("flipped");
        card.classList.remove("flipped");
        lock = false;
        if (players >= 2) {
          currentPlayer = (currentPlayer % players) + 1;
          renderTurn();
        }
      }, 2300);
    }
  }

  function reset() {
    first = null;
    lock = false;
    moves = 0;
    matched = 0;
    scores = [0, 0, 0, 0];
    currentPlayer = 1;
    movesEl.textContent = "0";
    winEl.textContent = "";
    lastFlippedName = null;
    if (translationText) translationText.textContent = "";
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    if (confettiCanvas) confettiCanvas.style.display = "none";
    renderScores();
    renderTurn();
    buildDeck();
  }

  resetBtn.addEventListener("click", reset);

  themeSelect.addEventListener("change", () => {
    localStorage.setItem(STORAGE.theme, themeSelect.value);
    const savedCount = parseInt(countSelect.value, 10);
    populateCounts();
    if (savedCount && [...countSelect.options].some((o) => parseInt(o.value, 10) === savedCount)) {
      countSelect.value = String(savedCount);
    }
    pairCount = parseInt(countSelect.value, 10) / 2;
    reset();
  });

  countSelect.addEventListener("change", () => {
    localStorage.setItem(STORAGE.count, countSelect.value);
    pairCount = parseInt(countSelect.value, 10) / 2;
    reset();
  });

  levelSelect.addEventListener("change", () => {
    selectedLevel = parseInt(levelSelect.value, 10);
    if (!(selectedLevel >= 1 && selectedLevel <= 3)) selectedLevel = 3;
    localStorage.setItem(STORAGE.level, String(selectedLevel));
    reset();
  });

  populateThemes();
  populateCounts();

  selectedLevel = parseInt(localStorage.getItem(STORAGE.level), 10);
  if (!(selectedLevel >= 1 && selectedLevel <= 3)) selectedLevel = 3;
  levelSelect.value = String(selectedLevel);

  players = parseInt(localStorage.getItem(STORAGE.players), 10);
  if (!(players >= 1 && players <= 4)) players = 1;
  playersSelect.value = String(players);
  speechRate = parseFloat(localStorage.getItem(STORAGE.rate)) || 0.85;
  rateInput.value = String(speechRate);
  rateVal.textContent = `${speechRate.toFixed(2)}x`;

  pairCount = parseInt(countSelect.value, 10) / 2;
  reset();
</script>
</body>
</html>
