<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory & Quiz – Apprendre l'anglais</title>
  <style>
    :root {
      --bg: #0f1325;
      --card: #1f2640;
      --accent: #4f9deb;
      --accent2: #6ee7b7;
      --danger: #f87171;
      --success: #34d399;
      --warning: #fbbf24;
      --text: #eef1ff;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: radial-gradient(circle at 50% 0%, #1c2030, var(--bg) 70%);
      color: var(--text);
      padding: 24px;
    }
    h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.8rem); letter-spacing: 0.5px; text-align: center; }
    .subtitle { margin: 0; opacity: 0.85; text-align: center; font-size: clamp(0.9rem, 2vw, 1.1rem); }
    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(240px, 320px));
      gap: clamp(12px, 3vw, 24px);
      width: min(90vw, 720px);
    }
    .card-link {
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .game-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(79,157,235,0.12));
      border: 2px solid rgba(79,157,235,0.5);
      border-radius: 16px;
      padding: clamp(24px, 6vw, 48px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .game-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 18px 36px rgba(0,0,0,0.35);
      border-color: var(--accent2);
    }
    .emoji { font-size: clamp(3rem, 8vw, 5rem); line-height: 1; }
    .title { font-size: clamp(1.2rem, 3vw, 1.8rem); font-weight: 700; }
    .desc { opacity: 0.8; font-size: clamp(0.85rem, 2vw, 1rem); text-align: center; }
    @media (max-width: 600px) {
      .cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div style="text-align:center; display:flex; flex-direction:column; gap:8px;">
    <h1>Memory & Quiz</h1>
    <p class="subtitle">Apprendre l’anglais en jouant</p>
  </div>
  <div class="cards">
    <a class="card-link" href="memory.html">
      <div class="game-card">
        <div class="emoji">🧠</div>
        <div class="title">Memory</div>
        <div class="desc">Retrouve les paires et écoute le mot anglais</div>
      </div>
    </a>
    <a class="card-link" href="quiz.html">
      <div class="game-card">
        <div class="emoji">❓</div>
        <div class="title">Quiz</div>
        <div class="desc">Écoute un mot, choisis l’icône parmi 10</div>
      </div>
    </a>
  </div>
</body>
</html>
